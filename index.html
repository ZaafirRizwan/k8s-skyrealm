<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kubernetes Skyrealm</title>
<meta name="description" content="An interactive 3D Kubernetes visualization. Watch every request, watch event, etcd Raft message, CRI call, DNS query and VXLAN packet flow through a live cluster, with guided quests for Deployments, Services, Ingress, HPA, Argo CD, Flux, Kyverno, CSI storage and Prometheus.">
<meta name="keywords" content="kubernetes, k8s, kubernetes visualization, kubernetes architecture, interactive kubernetes tutorial, learn kubernetes, kube-apiserver, etcd, raft, kube-scheduler, kubelet, kube-proxy, containerd, cni, flannel, vxlan, coredns, ingress, hpa, gitops, argo cd, flux, kyverno, csi, prometheus, three.js, 3d, webgl">
<meta name="author" content="Zaafir Rizwan">
<meta name="theme-color" content="#141a2b">
<meta property="og:type" content="website">
<meta property="og:title" content="Kubernetes Skyrealm: an explorable 3D Kubernetes cluster">
<meta property="og:description" content="Follow every packet through a living Kubernetes cluster: control plane, nodes, Pods, networking, GitOps and more.">
<meta property="og:url" content="https://k8s-skyrealm.pages.dev/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://k8s-skyrealm.pages.dev/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed toon-shaded 3D sky world; navy-glass HUD with brass trim at the edges, Genshin-style dialogue band at the bottom. Single dark look by design. */
:root{
  --ink:#ece5d8; --ink-dim:#a9a397; --gold:#d3bc8e; --gold-hi:#f2dca8;
  --navy:rgba(26,31,49,.86); --navy-deep:#141a2b; --line:rgba(211,188,142,.32); --paper:#f4ecdb; --paper-ink:#2b2440;
  --ok:#2e9c6a; --bad:#d4553f;
  --display:'Cinzel','Trajan Pro',Georgia,serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--navy-deep);color:var(--ink);font-family:var(--body)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;text-align:center;font:600 12px/1.15 var(--body);color:var(--ink);background:rgba(22,27,44,.74);border:1px solid var(--line);padding:3px 10px 4px;border-radius:999px;backdrop-filter:blur(3px);will-change:transform;transition:border-color .2s}
.lbl b{display:block;font-weight:800;letter-spacing:.02em}
.lbl span{display:block;font:500 10px/1.3 var(--mono);color:var(--ink-dim)}
.lbl.big{background:rgba(22,27,44,.6)}
.lbl.big b{font-family:var(--display);font-size:15px;color:var(--gold-hi);letter-spacing:.08em}
.lbl.pod{font-size:11px;padding:2px 8px 3px;background:rgba(22,27,44,.62)}
.lbl.pod b{font-weight:700}
.lbl:hover,.lbl.sel{border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(242,220,168,.28)}
.lbl.down b{color:#ff9a86}
.pk{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font:700 12.5px/1.25 var(--body);color:#fff;background:rgba(14,18,32,.88);border:1.5px solid var(--pc,#fff);box-shadow:0 0 14px color-mix(in srgb,var(--pc,#fff) 55%,transparent);padding:5px 10px 6px 6px;border-radius:9px;will-change:transform;z-index:2}
.pk b{display:inline-block;font:800 10px/1 var(--mono);color:var(--paper-ink);background:var(--pc);border-radius:4px;padding:3px 5px;margin-right:7px;vertical-align:1px}
.pk small{display:block;font:600 11px/1.3 var(--body);color:var(--ink-dim);margin-top:2px;padding-left:2px}
#transit{display:grid;justify-content:center;gap:3px;margin:0 auto 10px;font-size:12.5px}
#transit em{font:700 10.5px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-style:normal;text-align:center;margin-bottom:2px}
#transit div{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--ink-dim)}
#transit div b{color:var(--ink)}
#transit div i{width:9px;height:9px;transform:rotate(45deg);background:var(--pc);box-shadow:0 0 8px var(--pc);flex:none}
#transit div span{font:500 11px var(--mono);color:var(--pc)}
#transit .more{font-size:11px}
.say{position:absolute;left:0;top:0;pointer-events:none;width:max-content;max-width:250px;font:700 12px/1.35 var(--body);color:var(--paper-ink);background:var(--paper);border:1.5px solid var(--gold);padding:6px 10px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.28);animation:pop .22s ease-out;will-change:transform}
.say code{font:600 11px var(--mono)}
.say.ok::before{content:'✓ ';color:var(--ok);font-weight:900}
.say.bad{background:#ffe5de;border-color:var(--bad)}
.say.bad::before{content:'✗ ';color:var(--bad);font-weight:900}
.say.score{background:#fff6d8;font-family:var(--mono);font-size:11px}
@keyframes pop{from{transform:scale(.8);opacity:0}}

.panel{position:fixed;background:var(--navy);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 3px rgba(20,26,43,.6),inset 0 0 0 4px rgba(211,188,142,.12);backdrop-filter:blur(8px)}
#brand{top:calc(14px + env(safe-area-inset-top,0px));left:16px;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px}
#brand svg{flex:none}
#brand h1{margin:0;font:700 17px/1.1 var(--display);letter-spacing:.12em;color:var(--gold-hi);text-transform:uppercase}
#brand p{margin:3px 0 0;font-size:11.5px;color:var(--ink-dim)}
#brand code{font-family:var(--mono);color:var(--ink)}
.mob{display:none}

#quests{top:calc(88px + env(safe-area-inset-top,0px));left:16px;width:286px;max-height:calc(100% - 300px);overflow:auto;padding:14px}
h2,h3{margin:0 0 10px;font:700 12px var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h3{margin-top:16px}
#qlist{display:grid;gap:8px}
.q{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;background:rgba(255,255,255,.035);border:1px solid rgba(211,188,142,.18);border-radius:10px;padding:9px 11px;cursor:pointer;transition:background .15s,border-color .15s}
.q:hover{background:rgba(255,255,255,.07);border-color:var(--line)}
.q.on{border-color:var(--gold-hi);background:rgba(242,220,168,.1)}
.q i{grid-row:span 2;font:700 13px var(--display);color:var(--gold);font-style:normal;padding-top:1px}
.q b{font-size:13.5px;font-weight:800}
.q span{font-size:11.5px;color:var(--ink-dim);line-height:1.35}
#legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.lg{display:flex;align-items:center;gap:7px;font-size:11.5px;min-width:0}
.lg i{flex:none;width:9px;height:9px;transform:rotate(45deg);background:var(--pc);box-shadow:0 0 8px var(--pc)}
.lg small{color:var(--ink-dim)}

#insp{top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:344px;max-height:calc(100% - 232px);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:11px 8px;cursor:pointer;font:700 11.5px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.tabs button.on{color:var(--gold-hi);box-shadow:inset 0 -2px 0 var(--gold)}
.tabs span{font:600 10px var(--mono);background:rgba(211,188,142,.18);border-radius:8px;padding:1px 6px;margin-left:4px}
#info,#log{overflow:auto;padding:14px 16px 16px;min-height:0}
#info h4{margin:0;font:700 18px/1.2 var(--display);color:var(--gold-hi);letter-spacing:.04em;text-wrap:balance}
#info .sub{margin:3px 0 10px;font:500 11px var(--mono);color:var(--ink-dim)}
#info p{margin:0 0 10px;font-size:13px;line-height:1.5}
#info ul{margin:0 0 10px;padding-left:18px;font-size:12.5px;line-height:1.5}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;font-size:12px}
#info dt{color:var(--ink-dim)}
#info dd{margin:0;font-family:var(--mono);font-size:11.5px;min-width:0;overflow-wrap:anywhere}
#info pre{margin:6px 0 12px;background:rgba(8,10,20,.55);border:1px solid rgba(211,188,142,.15);border-radius:8px;padding:9px 10px;font:400 11px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:#d9e4f5}
.leg{border-left:3px solid var(--pc);padding:2px 0 2px 10px;margin-bottom:6px}
.leg .h{display:flex;gap:8px;align-items:baseline;font-size:12px;flex-wrap:wrap}
.chip{font:700 10px var(--mono);color:var(--paper-ink);background:var(--pc);border-radius:4px;padding:2px 5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{background:rgba(242,220,168,.1);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700}
.btn:hover{background:rgba(242,220,168,.2)}
.btn.pri{background:var(--gold);color:var(--paper-ink);border-color:var(--gold-hi)}
.btn.pri:hover{background:var(--gold-hi)}
.btn:disabled{opacity:.4;cursor:default}
#log{list-style:none;margin:0;display:grid;gap:4px;align-content:start}
#log li{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:11.5px;background:rgba(255,255,255,.03)}
#log li:hover{background:rgba(255,255,255,.08)}
#log li .chip{grid-row:span 2;align-self:start;margin-top:1px}
#log li em{font-style:normal;font:500 10.5px var(--mono);color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--ink-dim);font-size:12.5px;line-height:1.5}

#dlg{position:fixed;left:0;right:0;bottom:0;padding:44px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(10,12,22,0),rgba(10,12,22,.78) 38%,rgba(10,12,22,.9));pointer-events:none}
#dlg .inner{max-width:820px;margin:0 auto;pointer-events:auto;text-align:center}
.who{display:flex;align-items:center;justify-content:center;gap:12px;font:700 15px var(--display);letter-spacing:.1em;color:var(--gold-hi)}
.who::before,.who::after{content:'';height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}
.who::after{transform:scaleX(-1)}
#txt{margin:8px auto 12px;max-width:68ch;min-height:3em;font-size:15.5px;line-height:1.55;color:#f6f1e7;text-wrap:pretty}
#txt code{font:600 13px var(--mono);color:var(--gold-hi)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;align-items:center;font-size:12px;color:var(--ink-dim)}
.ctl label{display:flex;align-items:center;gap:5px;cursor:pointer}
.ctl select{background:var(--navy);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#stepn{font:600 11px var(--mono);color:var(--gold)}
kbd{font:600 10px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink-dim)}

[hidden]{display:none!important}
.plain{background:rgba(242,220,168,.1);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 8px 8px 0;color:var(--gold-hi)}
.tabs .x{flex:0 0 40px;font:400 20px var(--body);letter-spacing:0;color:var(--ink-dim)}
details{margin-top:14px}
summary{cursor:pointer;font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
#flow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px;margin-bottom:10px;font:700 11.5px var(--body)}
#flow span{padding:3px 9px;border-radius:999px;border:1px solid rgba(211,188,142,.25);color:var(--ink-dim)}
#flow span.done{color:var(--ink);border-color:var(--line)}
#flow span.now{background:var(--gold);color:var(--paper-ink);border-color:var(--gold-hi)}
#flow i{font-style:normal;color:var(--gold);opacity:.6}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:6px}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;font:700 12px var(--body);color:var(--ink-dim)}
.seg button.on{background:var(--gold);color:var(--paper-ink)}
#mrank{font-size:12px;color:var(--ink-dim);margin-bottom:10px;line-height:1.5}
#mrank b{color:var(--gold-hi)}
#mlist{display:grid;gap:8px}
#mlist .tag{font:700 9.5px var(--mono);font-style:normal;color:var(--paper-ink);background:var(--gold);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:2px}
#mlist .st{color:var(--gold-hi);letter-spacing:.1em;font-size:13px}
#mlist h4{margin:0 0 6px;font:700 12px var(--display);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
#mlist ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.55}
#mlist code,#gtxt code,#gfb code,.mcard code{font:600 11.5px var(--mono);color:var(--gold-hi)}
#hud{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);background:var(--navy);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:13px;color:var(--ink-dim);z-index:3}
#hud #hTitle{font:700 13px var(--display);letter-spacing:.08em;color:var(--gold-hi)}
#hHearts{color:#ff6b7f;font-size:16px;letter-spacing:2px}
#hScore{color:var(--ink);font-variant-numeric:tabular-nums}
#hCombo{color:var(--gold-hi);font-weight:800}
#hCarry{display:flex;gap:6px;align-items:center;color:var(--ink);font-weight:700}
#hCarry:empty,#hCombo:empty{display:none}
#gbar{position:fixed;left:0;right:0;bottom:0;padding:40px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(10,12,22,0),rgba(10,12,22,.8) 30%,rgba(10,12,22,.93));pointer-events:none;z-index:2}
#gbar .inner{max-width:860px;margin:0 auto;pointer-events:auto;text-align:center}
#gtxt{margin:8px auto 12px;max-width:70ch;font-size:15.5px;line-height:1.55;color:#f6f1e7;text-wrap:pretty}
#gopts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gopt{display:grid;grid-template-columns:auto 1fr;gap:1px 9px;align-items:center;text-align:left;min-width:150px;max-width:300px;flex:1 1 170px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink);transition:transform .12s,background .12s,border-color .12s}
.gopt:hover:not(:disabled){background:rgba(242,220,168,.14);border-color:var(--gold-hi);transform:translateY(-2px)}
.gopt kbd{grid-row:span 2;font-size:11px;color:var(--gold-hi);border-color:var(--gold);padding:2px 6px}
.gopt b{font-size:13.5px}
.gopt small{font-size:11px;color:var(--ink-dim);line-height:1.35}
.gopt:disabled{opacity:.35;cursor:default}
.gopt.wrong{border-color:var(--bad)}
.gopt.right{border-color:#4fd18b;background:rgba(79,209,139,.16)}
.gopt.allow{border-color:#4fd18b}.gopt.deny{border-color:#ff6b7f}
.ghint{margin:0;font-size:12.5px;color:var(--ink-dim)}
#gfb{margin:10px auto 0;max-width:70ch;min-height:1.4em;font-size:14px;line-height:1.5}
#gfb.ok{color:#7ee2a8}#gfb.bad{color:#ff9a8a}
.req{display:grid;gap:4px;max-width:520px;margin:0 auto;text-align:left;background:rgba(244,236,219,.06);border:1px solid var(--line);border-radius:12px;padding:10px 14px;position:relative}
.req div{font-size:13.5px}.req span{display:inline-block;width:92px;color:var(--ink-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
.req small{color:var(--ink-dim)}
.timer{display:block;height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:6px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--gold);transition:width .1s linear}
#toast{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(460px,calc(100% - 32px));background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;line-height:1.45;text-align:center;z-index:4;animation:pop .2s ease-out}
#toast.gold{border-color:var(--gold-hi);box-shadow:0 0 18px rgba(242,220,168,.3)}
#toast.bad{border-color:var(--bad)}
#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(transparent 55%,rgba(212,85,63,.55));opacity:0;z-index:3}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{20%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,10,20,.55);z-index:5;padding:16px}
.mcard{position:relative;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px 24px}
.mcard h3{margin:0;font:700 22px var(--display);color:var(--gold-hi);letter-spacing:.06em;text-align:center}
.mcard h4{margin:14px 0 6px;font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.mcard ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
.mcard .miss li{color:#ffb4a8}
.mcard .btnrow{justify-content:center;margin-top:16px}
.stars{text-align:center;font-size:34px;color:var(--gold-hi);letter-spacing:6px;margin:6px 0}
.mdim{text-align:center;color:var(--ink-dim);font-size:13px;margin:4px 0}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.codex div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.4;min-width:0}
.codex b{display:block;color:var(--gold-hi);font-size:12.5px;margin-bottom:2px}
.codex .locked{opacity:.45}
#steer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:none;gap:10px;z-index:3}
#steer button{background:var(--navy);border:1px solid var(--line);border-radius:999px;padding:12px 20px;font:700 15px var(--body);color:var(--gold-hi);touch-action:none}
@media (pointer:coarse){#steer:not([hidden]){display:flex}}
@media (max-width:860px){
  #flow,#transit{display:none!important}
  #hud{top:calc(64px + env(safe-area-inset-top,0px));left:16px;right:16px;max-width:none;font-size:12px;gap:8px;padding:6px 12px}
  .seg button{padding:5px 10px}
  #gtxt{font-size:14px}
  .gopt{min-width:130px}
  .mob{display:inline-block}
  #brand{right:16px;padding:8px 10px}
  #brand h1{font-size:14px}
  #brand p{display:none}
  #brand .sp{flex:1}
  #quests,#insp{top:calc(72px + env(safe-area-inset-top,0px));left:16px;right:16px;width:auto;max-height:calc(100% - 330px);display:none}
  #quests.open{display:block}
  #insp.open{display:flex}
  #txt{font-size:14px}
  .ctl .opt{display:none}
}
@media (prefers-reduced-motion:reduce){.say{animation:none}}
</style>

<canvas id="world" tabindex="0" aria-label="3D Kubernetes cluster world. Drag to orbit, scroll to zoom, click anything to inspect it."></canvas>
<div id="labels"></div>

<header id="brand" class="panel">
  <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><polygon points="17,2 29,8 32,21 24,31 10,31 2,21 5,8" fill="none" stroke="#d3bc8e" stroke-width="1.6"/><circle cx="17" cy="17" r="4" fill="none" stroke="#f2dca8" stroke-width="1.6"/><g stroke="#f2dca8" stroke-width="1.4"><line x1="17" y1="13" x2="17" y2="6"/><line x1="20.1" y1="14.5" x2="25.6" y2="10.1"/><line x1="20.9" y1="17.9" x2="27.7" y2="19.4"/><line x1="18.7" y1="20.6" x2="21.8" y2="26.9"/><line x1="15.3" y1="20.6" x2="12.2" y2="26.9"/><line x1="13.1" y1="17.9" x2="6.3" y2="19.4"/><line x1="13.9" y1="14.5" x2="8.4" y2="10.1"/></g></svg>
  <div><h1>Kubernetes Skyrealm</h1><p>cluster <code>realm-prod</code> · v1.31 · 1 control plane · 4 nodes</p></div>
  <div class="seg" role="group" aria-label="Mode"><button id="mExplore" class="on">Explore</button><button id="mPlay">Play</button></div>
  <span class="sp"></span>

<script>
'use strict';
const $ = s => document.querySelector(s);
const V = THREE.Vector3;

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- protocols ("elements") ----------
const PROTO = {
  REST:    { c: 0x5fe0c5, name: 'HTTPS REST',  el: 'Anemo',   desc: 'Request to kube-apiserver (JSON/protobuf over TLS, :6443)' },

  RAFT:    { c: 0xff7a4d, name: 'Raft',        el: 'Pyro',    desc: 'etcd peer replication: AppendEntries, acks (:2380)' },
  CRI:     { c: 0xb57cff, name: 'CRI gRPC',    el: 'Electro', desc: 'kubelet → containerd over /run/containerd/containerd.sock' },
  OCI:     { c: 0xff9fd0, name: 'OCI pull',    el: 'Electro', desc: 'Image manifest and layer blobs from a registry' },
  HTTP:    { c: 0x9be05a, name: 'App HTTP',    el: 'Dendro',  desc: 'Your users\' traffic to workloads' },
  DNS:     { c: 0xbff0ff, name: 'DNS',         el: 'Cryo',    desc: 'UDP :53 query to CoreDNS' },
  VXLAN:   { c: 0x8a7bff, name: 'VXLAN',       el: 'Abyss',   desc: 'Pod packet wrapped in UDP :8472 node-to-node' },
  PROBE:   { c: 0xd6f56a, name: 'Probe',       el: 'Dendro',  desc: 'kubelet health check into a container' },

  RPC:     { c: 0xffc29a, name: 'Internal gRPC', el: 'Anemo', desc: 'Between a tool\'s own components (e.g. Argo CD)' },

};

// ---------- renderer / scene ----------
const canvas = $('#world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc7d8f0, 300, 950);
const camera = new THREE.PerspectiveCamera(46, 1, 0.5, 4000);
const HOME = { pos: new V(0, 105, 215), target: new V(0, 8, 0) };
camera.position.copy(HOME.pos);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.copy(HOME.target);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 460; controls.maxPolarAngle = Math.PI * 0.66;
controls.autoRotate = !REDUCED; controls.autoRotateSpeed = 0.35;
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xe4f0ff, 0x6d5a86, 0.8));
const sunLight = new THREE.DirectionalLight(0xfff0d4, 0.85); sunLight.position.set(140, 220, 90); scene.add(sunLight);

const sky = new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: { value: new V(0.45, 0.32, -0.83).normalize() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 sunDir; varying vec3 vP;
    void main(){ float h = vP.y;

// ---------- materials ----------
const gradMap = new THREE.DataTexture(new Uint8Array([105, 180, 255]), 3, 1, THREE.LuminanceFormat);
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter; gradMap.generateMipmaps = false; gradMap.needsUpdate = true;
const matCache = {};
function toon(color, extra) {
  if (!extra) return matCache[color] || (matCache[color] = new THREE.MeshToonMaterial({ color, gradientMap: gradMap }));

}
const OUTLINE = new THREE.MeshBasicMaterial({ color: 0x2b2440, side: THREE.BackSide });
function M(geo, color, parent, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, o.mat || toon(color, o.extra));

}
const glowTex = (() => {

  const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);

// ---------- sim clock ----------

const tweens = [];

const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const backOut = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);

// ---------- decor ----------
const bobbers = [], spinners = [], clouds = [];
const wfMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, uniforms: { t: { value: 0 } },

  fragmentShader: `uniform float t; varying vec2 vU;
    void main(){ float s = fract(vU.y * 5. + t * .9 + sin(vU.x * 18.) * .06);
      float a = (.5 + .4 * smoothstep(.75, .95, s)) * smoothstep(0., .45, vU.y) * smoothstep(0., .12, vU.x) * smoothstep(1., .88, vU.x);

function waterfall(parent, r, ang, w, h) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wfMat); m.raycast = () => {};
  m.position.set(Math.cos(ang) * (r + .25), -h / 2 + .1, Math.sin(ang) * (r + .25));
  m.rotation.y = Math.atan2(Math.cos(ang), Math.sin(ang)); parent.add(m);
  const mist = glow(0xffffff, 16, .45); mist.position.set(Math.cos(ang) * (r + 2), -h + 2, Math.sin(ang) * (r + 2)); mist.raycast = () => {}; parent.add(mist);
}
function tree(parent, x, z, s) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); parent.add(g);
  M(new THREE.CylinderGeometry(.35, .5, 2.4, 6), 0x8a5a3c, g, 0, 1.2, 0);
  M(new THREE.IcosahedronGeometry(1.9, 0), 0x5aa85a, g, 0, 3.6, 0, { extra: { flatShading: true } });

}
function island(pos, r, o = {}) {
  const g = new THREE.Group(); g.position.copy(pos); scene.add(g);
  M(new THREE.CylinderGeometry(r, r * .97, 1.6, 48), o.grass || 0x8ccc6c, g, 0, -.8, 0, { outline: false });
  M(new THREE.CylinderGeometry(r * .97, r * .86, 3.2, 48), 0xd4a97c, g, 0, -3.2, 0, { outline: false });
  const h = r * 1.55, cg = new THREE.ConeGeometry(r * .86, h, 18, 6), p = cg.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);

  for (const [a, s] of o.trees || []) tree(g, Math.cos(a) * r * .86, Math.sin(a) * r * .86, s);
  for (let i = 0; i < (o.rocks ?? 5); i++) {
    const a = rand(0, Math.PI * 2), d = rand(r * 1.05, r * 1.5);
    const m = M(new THREE.DodecahedronGeometry(rand(.8, 2.2), 0), 0x9b7f71, g, Math.cos(a) * d, rand(-12, -2), Math.sin(a) * d, { extra: { flatShading: true } });
    bobbers.push({ o: m, y: m.position.y, ph: rand(0, 6), amp: rand(.4, 1.1) });
  }
  const crys = M(new THREE.OctahedronGeometry(r * .07, 0), o.crystal || 0x8fe3ff, g, 0, -4.8 - h - 1.5, 0, { mat: basic(o.crystal || 0x8fe3ff) });
  crys.scale.y = 1.8; spinners.push({ o: crys, s: .0006 });
  const cg2 = glow(o.crystal || 0x8fe3ff, r * .5, .5); cg2.position.copy(crys.position); cg2.raycast = () => {}; g.add(cg2);
  return g;
}
function cloud(x, y, z, s) {
  const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g);
  for (let i = 0; i < 6; i++) {
    const m = new THREE.Mesh(CLOUD_GEO, toon(0xfdfcff)); m.raycast = () => {};
    m.scale.setScalar(rand(3, 6) * s); m.position.set(rand(-8, 8) * s, rand(-1, 2) * s, rand(-4, 4) * s); g.add(m);
  }
  clouds.push(g);
}
const CLOUD_GEO = new THREE.SphereGeometry(1, 14, 10);
for (let i = 0; i < 70; i++) cloud(rand(-420, 420), rand(-70, -38), rand(-380, 300), rand(.8, 1.6));
for (let i = 0; i < 16; i++) { const a = rand(0, Math.PI * 2), d = rand(360, 600); cloud(Math.cos(a) * d, rand(40, 120), Math.sin(a) * d, rand(1.4, 2.6)); }
const PN = 450, pPos = new Float32Array(PN * 3);
for (let i = 0; i < PN; i++) { pPos[i * 3] = rand(-170, 170); pPos[i * 3 + 1] = rand(-30, 100); pPos[i * 3 + 2] = rand(-150, 150); }
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const motes = new THREE.Points(pGeo, new THREE.PointsMaterial({ map: glowTex, size: 1.5, color: 0xfff0c0, transparent: true, opacity: .75, depthWrite: false, blending: THREE.AdditiveBlending }));
motes.raycast = () => {}; scene.add(motes);

// ---------- component registry ----------
const C = {};
const labelLayer = $('#labels');
function mkLabel(key, name, sub, cls = '') {
  const d = document.createElement('div'); d.className = 'lbl ' + cls;
  d.innerHTML = `<b>${esc(name)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}`;
  d.addEventListener('click', e => { e.stopPropagation(); select(key, true); });

}
function reg(key, name, obj, o = {}) {
  const c = Object.assign({ key, name, obj, anchorY: 4, labelY: 2.5, glowSize: 7, pulse: 0, maxD: 330, disp: name }, o);
  obj.traverse(m => { if (m.isMesh) m.userData.key = key; });
  c.glow = glow(0xffffff, c.glowSize, 0); c.glow.position.y = c.anchorY; c.glow.raycast = () => {}; obj.add(c.glow);
  if (o.label !== false) c.label = mkLabel(key, name, o.sub, o.labelClass);
  return (C[key] = c);
}
function unreg(key) { const c = C[key]; if (!c) return; c.label && c.label.remove(); delete C[key]; }
const _v = new V();
function anchor(key) { const c = C[key]; if (!c) return null; c.obj.updateWorldMatrix(true, false); return c.obj.localToWorld(new V(0, c.anchorY, 0)); }
function pulse(key, color) { const c = C[key]; if (!c) return; c.glow.material.color.setHex(color); c.pulse = 1; }

// ---------- control plane island ----------
const CP_POS = new V(0, 34, -44);
const cp = island(CP_POS, 27, { grass: 0x9ad47c, trees: [[.25, 1.1], [1.0, .9], [2.05, 1], [2.75, 1.2], [3.5, 1], [4.3, 1.15], [5.2, .9], [5.9, 1.05]], rocks: 8, crystal: 0x7ff0d8 });
waterfall(cp, 27, 2.3, 7, 60); waterfall(cp, 27, .75, 5, 46);

// kube-apiserver tower with three gate rings
const api = new THREE.Group(); api.position.set(0, 0, 5); cp.add(api);
M(new THREE.CylinderGeometry(4, 4.8, 2.4, 8), 0xe6dcc6, api, 0, 1.2, 0);
M(new THREE.CylinderGeometry(2.3, 3, 14, 8), 0xf7f2e7, api, 0, 9.4, 0);
M(new THREE.CylinderGeometry(3.2, 2.5, 1.4, 8), 0xd3bc8e, api, 0, 17, 0);
M(new THREE.ConeGeometry(2.6, 3.4, 8), 0x4f8f8a, api, 0, 19.4, 0);
const apiCrystal = M(new THREE.OctahedronGeometry(1.6, 0), 0x5fe0c5, api, 0, 23.3, 0, { mat: basic(0x7ff6dc) });
apiCrystal.scale.y = 1.6; spinners.push({ o: apiCrystal, s: .0012 });
const apiCg = glow(0x5fe0c5, 12, .7); apiCg.position.y = 23.3; apiCg.raycast = () => {}; api.add(apiCg);
const gateRings = [5.5, 9.2, 12.9].map((y, i) => {
  const r = new THREE.Mesh(new THREE.TorusGeometry(4.1, .26, 8, 40), basic(0xd3bc8e)); r.position.y = y; r.rotation.x = Math.PI / 2; api.add(r);
  return { m: r, flash: 0, base: new THREE.Color(0xd3bc8e) };

reg('api', 'kube-apiserver', api, { kind: 'api', sub: 'the front desk', anchorY: 11, labelY: 15, glowSize: 16, labelClass: 'big' });

// etcd trio (Raft)
const etcdG = new THREE.Group(); etcdG.position.set(-15, 0, -5); cp.add(etcdG);
M(new THREE.CylinderGeometry(7.2, 7.8, .8, 6), 0xcbbd9f, etcdG, 0, .4, 0, { outline: false });
[[0, 0, 3.6, 'etcd0', 'etcd-0', 'leader'], [-3.6, 0, -2.6, 'etcd1', 'etcd-1', 'follower'], [3.6, 0, -2.6, 'etcd2', 'etcd-2', 'follower']].forEach(([x, , z, key, name, role]) => {

});

// kube-scheduler observatory
const sch = new THREE.Group(); sch.position.set(15, 0, -5); cp.add(sch);
M(new THREE.CylinderGeometry(4.6, 5, 5, 12), 0xefe6d2, sch, 0, 2.5, 0);

// kube-controller-manager clockwork

  { who: 'Skyrealm', cam: 'home', text: 'That\'s the whole cast. Every glowing dot is one message between them, and you can click any dot or building to read it. Pick a quest on the left to follow one story from start to finish. <b>Birth of a Deployment</b> is the best next step.', run: k => k.wait(300) },
]},
{ t: 'Birth of a Deployment', s: 'kubectl apply → etcd → controllers → scheduler → kubelet → running Pods', steps: [
  { who: 'You', cam: 'you', text: 'You run <code>kubectl apply -f checkout.yaml</code>. kubectl reads your kubeconfig, converts the YAML to JSON and sends it over HTTPS to the API server. Nothing else in the cluster is ever contacted directly.',
    run: k => k.send('you', 'api', 'REST', 'POST deployments', rest('you', 'POST', '/apis/apps/v1/namespaces/shop/deployments?fieldManager=kubectl-client-side-apply',
`{
  "apiVersion": "apps/v1", "kind": "Deployment",
  "metadata": {"name": "checkout", "namespace": "shop"},
  "spec": {
    "replicas": 2,
    "selector": {"matchLabels": {"app": "checkout"}},
    "template": {
      "metadata": {"labels": {"app": "checkout"}},
      "spec": {"containers": [{
        "name": "checkout",
        "image": "registry.realm.io/shop/checkout:1.4.2",
        "ports": [{"containerPort": 8080}],
        "resources": {"requests": {"cpu": "250m", "memory": "256Mi"}},
        "readinessProbe": {"httpGet": {"path": "/ready", "port": 8080}}
      }]}
    }
  }
}`)) },
  { who: 'kube-apiserver', cam: 'api', text: 'Three gates before anything is stored. <b>Authentication</b>: who is this? (your client certificate). <b>Authorization</b>: may they do this? (RBAC). <b>Admission</b>: mutating plugins and webhooks fill in defaults, the schema is validated, then validating admission runs.',
    run: async k => {
      const L = ['Authentication: x509 cert <code>CN=you, O=shop-devs</code>', 'Authorization: RBAC RoleBinding <code>shop-devs</code> allows <code>create deployments</code>', 'Admission: defaults set (strategy RollingUpdate 25%/25%) · schema valid'];
      for (let i = 0; i < 3; i++) { k.do(() => flashGate(i)); k.say('api', L[i], 3400, 'ok'); await k.wait(800); }
    } },
  { who: 'etcd', cam: 'etcd0', text: 'Only the API server talks to etcd. It writes <code>/registry/deployments/shop/checkout</code> to the Raft <b>leader</b>, which appends it to its log and replicates it to both followers. Once a majority (2 of 3) has it on disk, the entry commits and the API server answers <code>201 Created</code>.',
    run: async k => { await etcdWrite(k, '/registry/deployments/shop/checkout', true); await k.send('api', 'you', 'REST', '201 Created', `HTTP/2 201 Created\n\n{"kind":"Deployment","metadata":{"name":"checkout","uid":"7b1e0c2a-…","resourceVersion":"${RV}","generation":1}, …}`); } },
  { who: 'kube-controller-manager', cam: 'kcm', text: 'Nothing is running yet. A Deployment is only a record of intent. The Deployment controller keeps a watch open on the API server, which now pushes it an <code>ADDED</code> event.',
    run: async k => { await watch(k, 'kcm', 'ADDED', 'Deployment', 'checkout', '"spec": {"replicas": 2}'); k.do(() => spin('deployment')); k.say('kcm', 'Deployment controller: no ReplicaSet for template hash <code>5f7c9d8b6</code> → create one', 3200); await k.wait(700); } },
  { who: 'kube-controller-manager', text: 'It creates a ReplicaSet. The ReplicaSet controller receives that over its own watch, compares 2 desired Pods with 0 existing, and creates two Pod objects. They are stored with no node assigned (<code>spec.nodeName</code> empty, phase Pending).',
    run: async k => {
      await apiCall(k, 'kcm', 'POST', '/apis/apps/v1/namespaces/shop/replicasets', 'POST replicaset', '{"metadata":{"name":"checkout-5f7c9d8b6","ownerReferences":[{"kind":"Deployment","name":"checkout"}]},"spec":{"replicas":2, …}}');
      await watch(k, 'kcm', 'ADDED', 'ReplicaSet', 'checkout-5f7c9d8b6');
      k.do(() => spin('replicaset')); k.say('kcm', 'ReplicaSet controller: want 2, have 0 → create 2 Pods', 3000);
      await Promise.all(['x8k2p', 'm4q7z'].map(s => apiCall(k, 'kcm', 'POST', '/api/v1/namespaces/shop/pods', 'POST pod', `{"metadata":{"generateName":"checkout-5f7c9d8b6-","name":"checkout-5f7c9d8b6-${s}"},"spec":{"nodeName":"", …}}`)));
      k.say('api', '2 Pods stored · phase <code>Pending</code> · no node yet', 2600);
    } },
  { who: 'kube-scheduler', cam: 'sched', dist: 70, text: 'The scheduler watches for Pods without a node. For each one it <b>filters</b> out nodes that can\'t run it (resources, taints, affinity), then <b>scores</b> the rest (least allocated, image locality, topology spread) and picks the highest.',
    run: async k => {
      await Promise.all(['x8k2p', 'm4q7z'].map(s => watch(k, 'sched', 'ADDED', 'Pod', 'checkout-5f7c9d8b6-' + s, '"spec": {"nodeName": ""}')));
      await scheduleOne(k, 'checkout-…-x8k2p', [['n1', true, 'fits · score 61 (ingress busy)'], ['n2', true, 'fits · score 79'], ['n3', true, 'fits · score 88 (most free CPU)'], ['n4', false, 'taint <code>pool=platform:NoSchedule</code>']], 'n3');
      k.say('sched', 'next Pod: x8k2p is now assumed on node-3, so spread favours node-2', 3000);
      await k.wait(700);
      await scheduleOne(k, 'checkout-…-m4q7z', [['n2', true, 'score 84'], ['n3', true, 'score 70 (spread penalty)']], 'n2');
    } },
  { who: 'kube-scheduler', text: 'The decision goes back to the API server as a <code>Binding</code> subresource, which sets <code>spec.nodeName</code>. That is all the scheduler does. It never contacts a node.',
    run: k => Promise.all([['x8k2p', 'node-3'], ['m4q7z', 'node-2']].map(([s, n]) => apiCall(k, 'sched', 'POST', `/api/v1/namespaces/shop/pods/checkout-5f7c9d8b6-${s}/binding`, 'POST pod/binding', `{"kind":"Binding","metadata":{"name":"checkout-5f7c9d8b6-${s}"},"target":{"kind":"Node","name":"${n}"}}`, { key: '/registry/pods/shop/checkout-5f7c9d8b6-' + s }))) },
  { who: 'kubelet', cam: 'n3', text: 'Each kubelet watches only Pods bound to its own node (<code>fieldSelector=spec.nodeName=node-3</code>). It asks containerd over CRI for a <b>pod sandbox</b>: the tiny pause container that owns the network namespace. The CNI plugin then gives the Pod its IP from the node\'s /24.',
    run: k => Promise.all([
      podStepSandbox(k, 'co1', 'n3', 2, 'checkout-5f7c9d8b6-x8k2p', '10.244.3.17'),
      podStepSandbox(k, 'co2', 'n2', 3, 'checkout-5f7c9d8b6-m4q7z', '10.244.2.24')]) },
  { who: 'containerd', cam: 'registry', dist: 80, text: 'Neither node has <code>checkout:1.4.2</code> cached, so containerd pulls it from the registry: first the manifest, then each layer blob by digest. Every blob is checked against its sha256 before it is unpacked.',
    run: k => Promise.all(['n3', 'n2'].map(n => pullOnly(k, n, APP.checkout.img))) },
  { who: 'kubelet', cam: 'n3', text: '<code>CreateContainer</code> and <code>StartContainer</code>: containerd\'s shim runs runc, which starts the process inside the sandbox\'s namespaces and cgroups. Then the kubelet runs the readiness probe and reports status back.',
    run: k => Promise.all([['co1', 'n3', 'checkout-5f7c9d8b6-x8k2p', '10.244.3.17'], ['co2', 'n2', 'checkout-5f7c9d8b6-m4q7z', '10.244.2.24']].map(async ([a, n, name, ip]) => {
      await k.send(n + '.kubelet', n + '.containerd', 'CRI', 'Create+StartContainer', `runtime.v1.RuntimeService/CreateContainer\nconfig { image { image: "${APP.checkout.img}" } }\nruntime.v1.RuntimeService/StartContainer\n→ runc start`);
      k.do(() => setPhase(a, 'running'));
      await k.send(n + '.kubelet', P(a), 'PROBE', 'GET /ready', `GET http://${ip}:8080/ready\nUser-Agent: kube-probe/1.31\n(readinessProbe · periodSeconds 10)`);
      await k.send(P(a), n + '.kubelet', 'PROBE', '200 OK', 'HTTP/1.1 200 OK\n\nready');
      await apiCall(k, n + '.kubelet', 'PATCH', `/api/v1/namespaces/shop/pods/${name}/status`, 'PATCH pod/status', `{"status":{"phase":"Running","podIP":"${ip}","conditions":[{"type":"Ready","status":"True"}]}}`, { key: '/registry/pods/shop/' + name });
    })) },
  { who: 'kube-proxy', cam: 'n2', dist: 90, text: 'The EndpointSlice controller adds the two ready Pod IPs to the <code>checkout</code> Service\'s EndpointSlice. Every kube-proxy watches EndpointSlices and rewrites its node\'s iptables rules, so connections to the Service\'s ClusterIP now reach the new Pods. The Deployment is done.',
    run: async k => { await watch(k, 'kcm', 'MODIFIED', 'Pod', 'checkout-5f7c9d8b6-x8k2p', '"status": {"conditions": [{"type": "Ready", "status": "True"}]}'); await endpoints(k, 'checkout', 2); } },
]},
{ t: 'A Traveler\'s Request', s: 'Browser → load balancer → NodePort → ingress-nginx → VXLAN overlay → Pod, and back', steps: [
  { who: 'You', cam: 'you', text: 'You open <code>https://shop.realm.io</code>. DNS points at the cloud load balancer that Kubernetes created for the ingress controller\'s <code>type: LoadBalancer</code> Service.',
    run: k => k.send('you', 'lb', 'HTTP', 'GET / (TLS)', 'TCP SYN 81.2.69.160:51544 → 34.120.8.9:443\nTLS 1.3 ClientHello  SNI=shop.realm.io\n\nGET / HTTP/2\nHost: shop.realm.io\nAccept: text/html') },
  { who: 'Cloud Load Balancer', cam: 'n1', dist: 80, text: 'The load balancer forwards to a healthy node\'s <b>NodePort</b> (30443). It has no idea Pods exist. On node-1, iptables rules written by kube-proxy DNAT the packet to the ingress-nginx Pod.',
    run: async k => {
      await k.path('lb', [{ to: 'n1.proxy', proto: 'HTTP', label: '→ 192.168.1.11:30443', payload: 'IPv4 34.120.8.9 → 192.168.1.11\nTCP  → :30443 (NodePort of svc ingress-nginx-controller)' }]);
      k.do(() => flashRules('n1')); k.say('n1.proxy', '<code>KUBE-NODEPORTS</code> :30443 → DNAT 10.244.1.5:443', 3000, 'ok');
      await k.send('n1.proxy', P('ing'), 'HTTP', '→ 10.244.1.5:443', 'IPv4 192.168.1.11 → 10.244.1.5 (after DNAT + SNAT)\nTCP  → :443\n(conntrack remembers the rewrite for the reply)');
    } },
  { who: 'ingress-nginx', cam: P('ing'), text: 'The ingress controller terminates TLS, matches the Ingress rule (host <code>shop.realm.io</code>, path <code>/</code> → Service <code>web:80</code>) and picks a backend. ingress-nginx skips the ClusterIP and load-balances straight to Pod IPs from the EndpointSlice.',
    run: async k => { k.say(P('ing'), 'TLS terminated · rule <code>shop.realm.io/</code> → <code>web:80</code>', 3000, 'ok'); await k.wait(900); k.say(P('ing'), 'upstream: <code>10.244.3.9:8080</code> (web-…-klmno, round-robin)', 3000); await k.wait(900); } },
  { who: 'flannel.1', cam: 'n1.vtep', dist: 110, text: 'The target Pod lives on node-3. The node routing table sends <code>10.244.3.0/24</code> via <code>flannel.1</code>, which wraps the whole Pod packet inside a UDP datagram addressed node-to-node. Click the purple packet to see the outer and inner headers.',
    run: k => k.path(P('ing'), podRoute('ing', 'web3', 'HTTP', 'GET / → 10.244.3.9', 'GET / HTTP/1.1\nHost: shop.realm.io\nX-Forwarded-For: 81.2.69.160\nX-Request-ID: 5c2f0d9e…')) },
  { who: 'web Pod', cam: P('web3'), text: 'node-3 unwraps the VXLAN packet, the cni0 bridge delivers it to the Pod\'s veth, and the web container answers.',
    run: async k => { k.say(P('web3'), '200 OK · 18.4 KB html · 11 ms', 2800, 'ok'); await k.wait(900); } },
  { who: 'Skyrealm', cam: 'n2', dist: 160, text: 'The reply retraces the path: VXLAN back to node-1, into ingress-nginx, then conntrack reverses the NAT and the load balancer returns it to you. You never knew which Pod answered.',
    run: async k => {
      const out = podRoute('web3', 'ing', 'HTTP', '200 OK', 'HTTP/1.1 200 OK\nContent-Type: text/html\nContent-Length: 18842');
      await k.path(P('web3'), out);
      await k.path(P('ing'), [{ to: 'n1.proxy', proto: 'HTTP', label: 'un-NAT (conntrack)', payload: 'conntrack entry reversed: src 10.244.1.5:443 → 192.168.1.11:30443' }, { to: 'lb', proto: 'HTTP', label: '200 OK', payload: 'HTTP/2 200\ncontent-type: text/html' }, { to: 'you', proto: 'HTTP', label: '200 OK · page', payload: 'HTTP/2 200\ncontent-type: text/html; charset=utf-8\nserver: nginx\n\n<!doctype html>…' }]);
    } },
]},
{ t: 'Asking the Oracle', s: 'Pod DNS lookup via CoreDNS, then a ClusterIP that no process listens on', steps: [
  { who: 'web Pod', cam: P('web1'), text: 'The web Pod on node-1 wants to call <code>orders</code>. Its <code>/etc/resolv.conf</code> (written by the kubelet) says <code>nameserver 10.96.0.10</code>, <code>search shop.svc.cluster.local svc.cluster.local cluster.local</code>, <code>ndots:5</code>.',
    run: async k => { k.say(P('web1'), 'A? <code>orders.shop.svc.cluster.local</code>', 3000); await k.wait(900); } },
  { who: 'kube-proxy', cam: 'n1', dist: 70, text: '<code>10.96.0.10</code> is the kube-dns Service, a virtual IP. Before the packet leaves node-1, iptables picks a CoreDNS endpoint and DNATs to it. kube-proxy wrote that rule earlier. It is not in the path itself.',
    run: async k => {
      await k.send(P('web1'), 'n1.proxy', 'DNS', 'A? orders → 10.96.0.10', 'UDP 10.244.1.12:41022 → 10.96.0.10:53\n;; QUESTION\norders.shop.svc.cluster.local. IN A');
      k.do(() => flashRules('n1')); k.say('n1.proxy', '<code>KUBE-SVC-TCOU7JCQXEZGVUNU</code> → DNAT 10.244.2.3:53', 3000, 'ok');
    } },
  { who: 'CoreDNS', cam: P('dns'), dist: 50, text: 'The query crosses the overlay to node-2. CoreDNS\'s <code>kubernetes</code> plugin keeps a watch on Services, so it answers from memory.',
    run: async k => {
      await k.path('n1.proxy', [{ to: 'n1.vtep', proto: 'DNS', label: '→ 10.244.2.3:53', payload: 'UDP 10.244.1.12 → 10.244.2.3:53' }, { to: 'n2.vtep', proto: 'VXLAN', label: 'VXLAN 192.168.1.11→.12', payload: 'Outer UDP :8472 VNI 1\nInner UDP 10.244.1.12 → 10.244.2.3:53 (DNS query)' }, { to: P('dns'), proto: 'DNS', label: 'A? orders', payload: 'orders.shop.svc.cluster.local. IN A' }]);
      k.say(P('dns'), '<code>orders.shop.svc.cluster.local. 5 IN A 10.96.88.4</code>', 3200, 'ok'); await k.wait(700);
      await k.path(P('dns'), [{ to: 'n2.vtep', proto: 'DNS', label: 'A 10.96.88.4', payload: ';; ANSWER\norders.shop.svc.cluster.local. 5 IN A 10.96.88.4' }, { to: 'n1.vtep', proto: 'VXLAN', label: 'VXLAN 192.168.1.12→.11', payload: 'Outer UDP :8472 VNI 1\nInner UDP 10.244.2.3:53 → 10.244.1.12' }, { to: 'n1.proxy', proto: 'DNS', label: 'un-DNAT src → 10.96.0.10', payload: 'conntrack: reply source rewritten 10.244.2.3 → 10.96.0.10' }, { to: P('web1'), proto: 'DNS', label: 'A 10.96.88.4', payload: ';; ANSWER\norders.shop.svc.cluster.local. 5 IN A 10.96.88.4' }]);
    } },
  { who: 'web Pod', cam: 'n1', dist: 80, text: 'Now the Pod opens TCP to <code>10.96.88.4:80</code>. No machine owns that address. iptables on node-1 matches <code>KUBE-SVC-ORDERS</code>, picks an endpoint (random, weighted by count) and DNATs to <code>10.244.2.21:8080</code>.',
    run: async k => {
      await k.send(P('web1'), 'n1.proxy', 'HTTP', 'SYN → 10.96.88.4:80', 'TCP SYN 10.244.1.12:50122 → 10.96.88.4:80');
      k.do(() => flashRules('n1')); k.say('n1.proxy', '<code>KUBE-SVC-ORDERS</code> 1 endpoint → DNAT 10.244.2.21:8080', 3000, 'ok');
      await k.path('n1.proxy', [{ to: 'n1.vtep', proto: 'HTTP', label: 'GET /orders', payload: 'GET /orders?user=42 HTTP/1.1\nHost: orders' }, { to: 'n2.vtep', proto: 'VXLAN', label: 'VXLAN 192.168.1.11→.12', payload: 'Outer UDP :8472 VNI 1\nInner TCP 10.244.1.12 → 10.244.2.21:8080' }, { to: P('orders'), proto: 'HTTP', label: 'GET /orders', payload: 'GET /orders?user=42 HTTP/1.1' }]);
      k.say(P('orders'), '200 · <code>{"orders": 3}</code>', 2600, 'ok'); await k.wait(500);
      await k.path(P('orders'), [{ to: 'n2.vtep', proto: 'HTTP', label: '200', payload: 'HTTP/1.1 200 OK\n{"orders":3}' }, { to: 'n1.vtep', proto: 'VXLAN', label: 'VXLAN back', payload: 'Outer UDP :8472\nInner 10.244.2.21 → 10.244.1.12' }, { to: P('web1'), proto: 'HTTP', label: '200 {"orders":3}', payload: 'HTTP/1.1 200 OK\nContent-Type: application/json\n\n{"orders":3}' }]);
    } },
]},
{ t: 'Heartbeat of the Realm', s: 'Node Leases, a node going dark, eviction and rescheduling', steps: [
  { who: 'kubelet', cam: 'api', dist: 150, text: 'Every 10 seconds each kubelet renews its <code>Lease</code> in <code>kube-node-lease</code>. That small write is the node\'s heartbeat. Full node status is only sent when something changes, or every 5 minutes.',
    run: k => Promise.all(NODES.map(N => apiCall(k, N.key + '.kubelet', 'PUT', `/apis/coordination.k8s.io/v1/namespaces/kube-node-lease/leases/${N.name}`, 'PUT lease', `{"kind":"Lease","metadata":{"name":"${N.name}"},"spec":{"holderIdentity":"${N.name}","leaseDurationSeconds":40,"renewTime":"${new Date().toISOString()}"}}`, { key: '/registry/leases/kube-node-lease/' + N.name }))) },
  { who: 'node-3', cam: 'n3', dist: 80, text: 'node-3 loses power. Its kubelet stops renewing the Lease. Its Pods may still be running, but nothing can confirm that.',
    run: async k => { k.do(() => setNodeUp('n3', false)); k.say('n3', 'power loss · kubelet silent', 3000, 'bad'); await k.wait(1200); } },
  { who: 'kube-controller-manager', cam: 'kcm', text: 'The node-lifecycle controller watches Leases. After <code>node-monitor-grace-period</code> (40 s) without a renewal, it marks the node <code>Ready=Unknown</code> and adds the taint <code>node.kubernetes.io/unreachable:NoExecute</code>.',
    run: async k => {
      k.do(() => spin('nodelifecycle'));
      for (const s of [10, 20, 30, 40]) { k.say('kcm', `node-3 lease age <code>${s}s</code>${s === 40 ? ' → grace period exceeded' : ''}`, 900, s === 40 ? 'bad' : ''); await k.wait(650); }
      await apiCall(k, 'kcm', 'PATCH', '/api/v1/nodes/node-3/status', 'PATCH node Ready=Unknown', '{"status":{"conditions":[{"type":"Ready","status":"Unknown","reason":"NodeStatusUnknown"}]},\n "spec":{"taints":[{"key":"node.kubernetes.io/unreachable","effect":"NoExecute"}]}}', { key: '/registry/minions/node-3' });
    } },
  { who: 'kube-controller-manager', text: 'Each Pod carries a default toleration of 300 s for that taint. When it expires, the taint manager evicts the Pods: they are deleted from the API, and the EndpointSlice controller removes them from Services right away.',
    run: async k => {
      for (const s of [60, 180, 300]) { k.say('kcm', `toleration timer <code>${s}s / 300s</code>`, 800); await k.wait(600); }
      await Promise.all(['web3', 'metrics'].map(a => { const name = pods[a] ? pods[a].name : a; k.do(() => setPhase(a, 'ghost')); return apiCall(k, 'kcm', 'DELETE', `/api/v1/namespaces/${nsOf(a)}/pods/${name}`, 'DELETE pod (evict)', '{"kind":"DeleteOptions","gracePeriodSeconds":0}', { key: `/registry/pods/${nsOf(a)}/${name}` }); }));
      await endpoints(k, 'web', 2);
    } },
  { who: 'kube-scheduler', cam: 'sched', dist: 80, text: 'The ReplicaSet controllers see fewer Pods than desired and create replacements. The scheduler filters out node-3 because of its taint and places them elsewhere.',
    run: async k => {
      k.do(() => spin('replicaset'));
      await Promise.all([['web-6d8f9c7b5-q2w8r', 'web'], ['metrics-server-6b9c7d-zt5vb', 'metrics']].map(([n]) => apiCall(k, 'kcm', 'POST', '/api/v1/namespaces/shop/pods', 'POST pod', `{"metadata":{"name":"${n}"}}`)));
      await scheduleOne(k, 'web-…-q2w8r', [['n1', true, 'score 74'], ['n2', true, 'score 69'], ['n3', false, 'taint unreachable:NoExecute']], 'n1');
      await scheduleOne(k, 'metrics-server-…-zt5vb', [['n2', true, 'score 72']], 'n2');
      await Promise.all([['web-6d8f9c7b5-q2w8r', 'node-1'], ['metrics-server-6b9c7d-zt5vb', 'node-2']].map(([n, node]) => apiCall(k, 'sched', 'POST', `/api/v1/namespaces/shop/pods/${n}/binding`, 'POST binding', `{"target":{"kind":"Node","name":"${node}"}}`)));
    } },
  { who: 'kubelet', cam: 'n1', dist: 80, text: 'node-1 and node-2 already have these images cached, so the replacements start in seconds. The web Service is back to 3 endpoints.',
    run: async k => {
      await Promise.all([podStart(k, 'web6', 'n1', 2, 'web-6d8f9c7b5-q2w8r', 'web', '10.244.1.19'), podStart(k, 'metrics2', 'n2', 4, 'metrics-server-6b9c7d-zt5vb', 'metrics', '10.244.2.30')]);
      await endpoints(k, 'web', 3);
    } },
  { who: 'node-3', cam: 'n3', dist: 80, text: 'Power returns. The kubelet renews its Lease, the node goes Ready, and the taint is removed. Its stale containers belong to Pods that no longer exist in the API, so the kubelet cleans them up. Desired state wins.',
    run: async k => {
      k.do(() => setNodeUp('n3', true));
      await apiCall(k, 'n3.kubelet', 'PUT', '/apis/coordination.k8s.io/v1/namespaces/kube-node-lease/leases/node-3', 'PUT lease', '{"spec":{"renewTime":"now"}}', { key: '/registry/leases/kube-node-lease/node-3' });
      await watch(k, 'n3.kubelet', 'SYNC', 'PodList', 'node-3', '"items": [] (web-…-klmno, metrics-… gone)');
      await k.send('n3.kubelet', 'n3.containerd', 'CRI', 'StopPodSandbox ×2', 'runtime.v1.RuntimeService/StopPodSandbox\nruntime.v1.RuntimeService/RemovePodSandbox\n(orphaned Pods: web-6d8f9c7b5-klmno, metrics-server-6b9c7d-pp7d2)');
      k.do(() => { removePod('web3'); removePod('metrics'); });
      k.say('n3', 'Ready · taint removed · orphans cleaned', 3000, 'ok');
    } },
]},
{ t: 'Scaling the Tide', s: 'metrics-server, HorizontalPodAutoscaler and the aggregation layer', steps: [
  { who: 'You', cam: 'n2', dist: 150, text: 'A sale starts. Traffic floods in through the ingress, and CPU on the three web Pods climbs.',
    run: async k => { for (let i = 0; i < 9; i++) { const t = ['web1', 'web2', 'web3'][i % 3]; k.path('you', [{ to: 'lb', proto: 'HTTP', label: 'GET /sale', payload: 'GET /sale HTTP/2' }, { to: 'n1.proxy', proto: 'HTTP', label: 'NodePort', payload: '→ :30443' }, { to: P('ing'), proto: 'HTTP', label: 'GET /sale', payload: 'GET /sale' }, ...podRoute('ing', t, 'HTTP', 'GET /sale', 'GET /sale HTTP/1.1')]); await k.wait(260); } await k.wait(1500); } },
  { who: 'metrics-server', cam: P('metrics'), text: 'Every 15 s metrics-server scrapes each kubelet\'s <code>/metrics/resource</code> endpoint. The kubelet reads the numbers from cgroups through cAdvisor.',
    run: k => Promise.all(['n1', 'n2', 'n3'].map(async n => {
      await k.send(P('metrics'), n + '.kubelet', 'METRICS', 'GET :10250/metrics/resource', `GET https://${NODE[n].ip}:10250/metrics/resource\nAuthorization: Bearer <metrics-server SA token>`);
      await k.send(n + '.kubelet', P('metrics'), 'METRICS', 'cpu/mem samples', `container_cpu_usage_seconds_total{pod="web-…",container="web"} 1834.2 1728900000000\ncontainer_memory_working_set_bytes{pod="web-…"} 2.41e+08`);
    })) },
  { who: 'kube-controller-manager', cam: 'kcm', text: 'The HPA controller asks the API server for <code>metrics.k8s.io</code>. The apiserver doesn\'t store metrics; its <b>aggregation layer</b> proxies the request to metrics-server.',
    run: async k => {
      k.do(() => spin('hpa'));
      await k.send('kcm', 'api', 'REST', 'GET metrics.k8s.io pods', rest('kcm', 'GET', '/apis/metrics.k8s.io/v1beta1/namespaces/shop/pods?labelSelector=app%3Dweb'));
      await k.send('api', P('metrics'), 'REST', 'proxy → APIService', 'APIService v1beta1.metrics.k8s.io → service kube-system/metrics-server:443\n(aggregation layer forwards the request)');
      await k.send(P('metrics'), 'api', 'REST', 'PodMetricsList', '{"kind":"PodMetricsList","items":[\n {"metadata":{"name":"web-…-abcde"},"containers":[{"usage":{"cpu":"231m"}}]},\n {"metadata":{"name":"web-…-fghij"},"containers":[{"usage":{"cpu":"229m"}}]},\n {"metadata":{"name":"web-…-klmno"},"containers":[{"usage":{"cpu":"230m"}}]}]}');
      await k.send('api', 'kcm', 'REST', '200 PodMetricsList', 'HTTP/2 200\n(average 230m of 250m request = 92%)');
      k.say('kcm', 'HPA: avg CPU <code>92%</code> vs target <code>60%</code> → ⌈3 × 92/60⌉ = <b>5</b>', 4000);
      await k.wait(900);
    } },
  { who: 'kube-controller-manager', text: 'The HPA writes <code>replicas: 5</code> to the Deployment\'s scale subresource. From there the usual chain runs: Deployment → ReplicaSet → 2 new Pods → scheduler.',
    run: async k => {
      await apiCall(k, 'kcm', 'PATCH', '/apis/apps/v1/namespaces/shop/deployments/web/scale', 'PATCH deploy/web/scale', '{"spec":{"replicas":5}}', { key: '/registry/deployments/shop/web' });
      k.do(() => { spin('deployment'); spin('replicaset'); });
      await Promise.all(['t7vqs', 'p3mzc'].map(s => apiCall(k, 'kcm', 'POST', '/api/v1/namespaces/shop/pods', 'POST pod', `{"metadata":{"name":"web-6d8f9c7b5-${s}"}}`)));
      await scheduleOne(k, 'web-…-t7vqs', [['n1', true, 'score 71'], ['n3', true, 'score 80']], 'n3');
      await scheduleOne(k, 'web-…-p3mzc', [['n1', true, 'score 77'], ['n3', true, 'score 66']], 'n1');
      await Promise.all([['t7vqs', 'node-3'], ['p3mzc', 'node-1']].map(([s, n]) => apiCall(k, 'sched', 'POST', `/api/v1/namespaces/shop/pods/web-6d8f9c7b5-${s}/binding`, 'POST binding', `{"target":{"kind":"Node","name":"${n}"}}`)));
    } },
  { who: 'kubelet', cam: 'n1', dist: 140, text: 'Both kubelets start their Pods (the image is cached), readiness passes, and the endpoints grow to 5. Load per Pod drops back toward 55%.',
    run: async k => {
      await Promise.all([podStart(k, 'web5', 'n3', 2, 'web-6d8f9c7b5-t7vqs', 'web', '10.244.3.21'), podStart(k, 'web4', 'n1', 2, 'web-6d8f9c7b5-p3mzc', 'web', '10.244.1.23')]);
      await endpoints(k, 'web', 5);
    } },
]},
{ t: 'Fall and Rise', s: 'Liveness probe failures, container restart and endpoint removal', steps: [
  { who: 'kubelet', cam: P('web2'), text: 'The kubelet on node-2 runs the web container\'s liveness probe: <code>GET /healthz</code> every 10 s, 1 s timeout, 3 failures allowed.',
    run: async k => { for (let i = 0; i < 2; i++) { await k.send('n2.kubelet', P('web2'), 'PROBE', 'GET /healthz', 'GET http://10.244.2.15:8080/healthz\nUser-Agent: kube-probe/1.31'); await k.send(P('web2'), 'n2.kubelet', 'PROBE', '200 ok', 'HTTP/1.1 200 OK\n\nok'); } } },
  { who: 'web Pod', text: 'A deadlock. The process is alive but stuck, and the probes start timing out.',
    run: async k => {
      k.do(() => setPhase('web2', 'crash'));
      for (let i = 1; i <= 3; i++) { await k.send('n2.kubelet', P('web2'), 'PROBE', 'GET /healthz', 'GET http://10.244.2.15:8080/healthz'); k.say(P('web2'), `timeout after 1s · failure ${i}/3`, 1600, 'bad'); await k.wait(600); }
    } },
  { who: 'kubelet', cam: 'n2', dist: 60, text: 'After 3 failures the kubelet kills the container (SIGTERM, then SIGKILL after the grace period) and creates a fresh one in the <b>same Pod</b>. Same sandbox, same IP, <code>restartCount: 1</code>.',
    run: async k => {
      await k.send('n2.kubelet', 'n2.containerd', 'CRI', 'StopContainer', 'runtime.v1.RuntimeService/StopContainer\ncontainer_id: "9b2e…"\ntimeout: 30   # SIGTERM, SIGKILL at 30s');
      k.do(() => { pods.web2.box.visible = false; });
      await apiCall(k, 'n2.kubelet', 'PATCH', '/api/v1/namespaces/shop/pods/web-6d8f9c7b5-fghij/status', 'PATCH Ready=False', '{"status":{"conditions":[{"type":"Ready","status":"False"}],"containerStatuses":[{"name":"web","state":{"terminated":{"reason":"Error","exitCode":137}}}]}}', { key: '/registry/pods/shop/web-6d8f9c7b5-fghij' });
      await endpoints(k, 'web', 2);
      await k.send('n2.kubelet', 'n2.containerd', 'CRI', 'Create+StartContainer', 'runtime.v1.RuntimeService/CreateContainer  (attempt: 1)\nruntime.v1.RuntimeService/StartContainer');
      k.do(() => { pods.web2.restarts = 1; setPhase('web2', 'running'); });
    } },
  { who: 'kube-proxy', cam: 'n2', dist: 110, text: 'The readiness probe passes again, the kubelet reports <code>Ready=True</code> and <code>restartCount: 1</code>, and the Pod rejoins the Service. The other replicas carried the traffic in the meantime.',
    run: async k => {
      await k.send('n2.kubelet', P('web2'), 'PROBE', 'GET /ready', 'GET http://10.244.2.15:8080/ready'); await k.send(P('web2'), 'n2.kubelet', 'PROBE', '200 ready', 'HTTP/1.1 200 OK');
      await apiCall(k, 'n2.kubelet', 'PATCH', '/api/v1/namespaces/shop/pods/web-6d8f9c7b5-fghij/status', 'PATCH Ready=True', '{"status":{"conditions":[{"type":"Ready","status":"True"}],"containerStatuses":[{"name":"web","restartCount":1,"ready":true}]}}', { key: '/registry/pods/shop/web-6d8f9c7b5-fghij' });
      await endpoints(k, 'web', 3);
    } },
]},
{ t: 'Argo CD Sync', s: 'git push → webhook → repo-server render → diff → server-side apply → rollout', steps: [
  { who: 'You', cam: 'git', dist: 60, text: 'With GitOps you don\'t run kubectl against production. You commit to the deploy repo: <code>web</code> image 2.3.0 → 2.4.0, replicas 3 → 4. Git is now the source of truth.',
    run: async k => { await k.send('you', 'git', 'GIT', 'git push origin main', 'POST /shop/deploy.git/git-receive-pack HTTP/1.1\nContent-Type: application/x-git-receive-pack-request\n\n1a7e94c..9f3c2ab main\n\ncommit 9f3c2ab\n  apps/web/kustomization.yaml\n-  newTag: 2.3.0\n+  newTag: 2.4.0\n-  replicas: 3\n+  replicas: 4'); k.do(() => { addCommit(); C.git.label.querySelector('span').textContent = 'main @ 9f3c2ab'; }); k.say('git', 'main → <code>9f3c2ab</code>', 2600, 'ok'); } },
  { who: 'git.realm.io', cam: 'n1', dist: 150, text: 'The Git host fires a webhook. It enters the cluster like any user request (load balancer → ingress) and reaches argocd-server on the platform node. Without the webhook, Argo CD polls every 3 minutes.',
    run: k => k.path('git', [{ to: 'lb', proto: 'GIT', label: 'POST /api/webhook', payload: 'POST /api/webhook HTTP/1.1\nHost: argocd.realm.io\nX-Hub-Signature-256: sha256=…\n\n{"ref":"refs/heads/main","after":"9f3c2ab…","repository":{"url":"https://git.realm.io/shop/deploy.git"}}' }, { to: 'n1.proxy', proto: 'HTTP', label: 'NodePort', payload: '→ :30443' }, { to: P('ing'), proto: 'HTTP', label: 'host argocd.realm.io', payload: 'Ingress rule argocd.realm.io → argocd-server:443' }, ...podRoute('ing', 'argosrv', 'HTTP', 'POST /api/webhook', 'POST /api/webhook')]) },
  { who: 'argocd-server', cam: 'n4', dist: 70, text: 'argocd-server matches the repo URL to the Application <code>shop-web</code> and asks for a refresh by annotating it through the Kubernetes API. Argo CD keeps its own state in CRDs too.',
    run: async k => { await apiCall(k, P('argosrv'), 'PATCH', '/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/shop-web', 'PATCH Application refresh', '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"normal"}}}', { key: '/registry/argoproj.io/applications/argocd/shop-web' }); await watch(k, P('argoctl'), 'MODIFIED', 'Application', 'shop-web', '"annotations": {"argocd.argoproj.io/refresh": "normal"}'); } },
  { who: 'argocd-repo-server', text: 'The application-controller asks repo-server for manifests at the new revision. repo-server fetches the commit, runs <code>kustomize build overlays/prod</code>, and caches the result by commit SHA.',
    run: async k => {
      await k.send(P('argoctl'), P('argorepo'), 'RPC', 'GenerateManifest', 'repository.RepoServerService/GenerateManifest\nrepo: https://git.realm.io/shop/deploy.git\nrevision: main\npath: apps/web/overlays/prod\nappName: shop-web');
      await k.send(P('argorepo'), 'git', 'GIT', 'git fetch', 'POST /shop/deploy.git/git-upload-pack HTTP/1.1\nwant 9f3c2ab… have 1a7e94c…');
      await k.send('git', P('argorepo'), 'GIT', 'packfile (3 objects)', 'HTTP/1.1 200 OK\nContent-Type: application/x-git-upload-pack-result\n\nPACK v2, 3 objects, 1.1 KiB');
      k.say(P('argorepo'), '<code>kustomize build</code> → 7 manifests', 2600, 'ok'); await k.wait(600);
      await k.send(P('argorepo'), P('argoctl'), 'RPC', 'ManifestResponse', 'ManifestResponse {\n  manifests: [Deployment/web, Service/web, Ingress/web, HPA/web, …]\n  revision: 9f3c2ab\n}');
    } },
  { who: 'argocd-application-controller', cam: P('argoctl'), text: 'The controller diffs the desired manifests against live state from its watch cache: <b>OutOfSync</b>. It applies the change with server-side apply. To the API server it is just another client, going through the same authn, RBAC and admission gates.',
    run: async k => { k.say(P('argoctl'), 'OutOfSync: Deployment/web · image <code>2.3.0→2.4.0</code> · replicas <code>3→4</code>', 3400, 'bad'); await k.wait(900); await apiCall(k, P('argoctl'), 'PATCH', '/apis/apps/v1/namespaces/shop/deployments/web?fieldManager=argocd-controller', 'PATCH (server-side apply)', 'Content-Type: application/apply-patch+yaml\n\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: web, namespace: shop}\nspec:\n  replicas: 4\n  template:\n    spec:\n      containers:\n      - name: web\n        image: registry.realm.io/shop/web:2.4.0', { key: '/registry/deployments/shop/web', reply: '200 OK' }); } },
  { who: 'kube-controller-manager', cam: 'kcm', text: 'From here Kubernetes takes over. A new pod template means a new ReplicaSet. The Deployment controller rolls it out with <code>maxSurge 25%</code> and <code>maxUnavailable 25%</code>, scaling the new ReplicaSet up as the old one scales down. We follow one new Pod.',
    run: async k => {
      await watch(k, 'kcm', 'MODIFIED', 'Deployment', 'web', '"spec": {"replicas": 4}'); k.do(() => { spin('deployment'); spin('replicaset'); });
      await apiCall(k, 'kcm', 'POST', '/apis/apps/v1/namespaces/shop/replicasets', 'POST replicaset web-7f5c8', '{"metadata":{"name":"web-7f5c8d9f4"},"spec":{"replicas":1}}');
      await apiCall(k, 'kcm', 'POST', '/api/v1/namespaces/shop/pods', 'POST pod', '{"metadata":{"name":"web-7f5c8d9f4-h2k9s"}}');
      await scheduleOne(k, 'web-7f5c8d9f4-h2k9s', [['n2', true, 'score 76'], ['n3', true, 'score 71']], 'n2');
      await apiCall(k, 'sched', 'POST', '/api/v1/namespaces/shop/pods/web-7f5c8d9f4-h2k9s/binding', 'POST binding', '{"target":{"kind":"Node","name":"node-2"}}');
      await podStart(k, 'webv2', 'n2', 3, 'web-7f5c8d9f4-h2k9s', 'web', '10.244.2.33', { pull: true, img: 'registry.realm.io/shop/web:2.4.0' });
    } },
  { who: 'argocd-application-controller', cam: 'n4', dist: 70, text: 'When the rollout completes, the controller records the result on the Application: <b>Synced</b> to <code>9f3c2ab</code>, <b>Healthy</b>. If someone hand-edits the Deployment later, Argo CD flags drift and (with selfHeal) reverts it.',
    run: async k => { await apiCall(k, P('argoctl'), 'PATCH', '/apis/argoproj.io/v1alpha1/namespaces/argocd/applications/shop-web/status', 'PATCH Application status', '{"status":{"sync":{"status":"Synced","revision":"9f3c2ab"},"health":{"status":"Healthy"},"operationState":{"phase":"Succeeded"}}}', { key: '/registry/argoproj.io/applications/argocd/shop-web' }); k.say(P('argoctl'), 'Synced ✓ · Healthy ✓ · <code>9f3c2ab</code>', 3200, 'ok'); } },
]},
{ t: 'Flux Reconcile', s: 'GitRepository artifact → Kustomization build → apply → health check', steps: [
  { who: 'You', cam: 'git', dist: 60, text: 'Same idea, different tool. Flux is a set of controllers with no central server. You commit <code>orders</code> replicas 1 → 2.',
    run: async k => { await k.send('you', 'git', 'GIT', 'git push origin main', 'POST /shop/deploy.git/git-receive-pack\n\n9f3c2ab..4be1d0c main\n  apps/orders/deployment.yaml\n-  replicas: 1\n+  replicas: 2'); k.do(() => { addCommit(); C.git.label.querySelector('span').textContent = 'main @ 4be1d0c'; }); } },
  { who: 'source-controller', cam: P('fluxsrc'), text: 'source-controller reconciles the <code>GitRepository</code> on its interval (1 m here). It fetches the new commit, packs it into a tarball artifact with a sha256 digest, and serves it over HTTP inside the cluster.',
    run: async k => {
      await k.send(P('fluxsrc'), 'git', 'GIT', 'git fetch (interval 1m)', 'POST /shop/deploy.git/git-upload-pack\nwant 4be1d0c…');
      await k.send('git', P('fluxsrc'), 'GIT', 'packfile', 'PACK v2, 2 objects');
      k.say(P('fluxsrc'), 'artifact <code>4be1d0c.tar.gz</code> · sha256:e1c0…', 2800, 'ok');
      await apiCall(k, P('fluxsrc'), 'PATCH', '/apis/source.toolkit.fluxcd.io/v1/namespaces/flux-system/gitrepositories/shop/status', 'PATCH GitRepository status', '{"status":{"artifact":{"revision":"main@sha1:4be1d0c","url":"http://source-controller.flux-system.svc/gitrepository/flux-system/shop/4be1d0c.tar.gz","digest":"sha256:e1c0…"}}}', { key: '/registry/source.toolkit.fluxcd.io/gitrepositories/flux-system/shop' });
    } },
  { who: 'kustomize-controller', cam: P('fluxkus'), text: 'kustomize-controller watches GitRepository objects. It sees the new revision, downloads the artifact from source-controller, runs <code>kustomize build</code>, decrypts any SOPS secrets, and does a server-side dry-run to find what changed.',
    run: async k => {
      await watch(k, P('fluxkus'), 'MODIFIED', 'GitRepository', 'shop', '"status": {"artifact": {"revision": "main@sha1:4be1d0c"}}');
      await k.send(P('fluxkus'), P('fluxsrc'), 'HTTP', 'GET artifact tar.gz', 'GET http://source-controller.flux-system.svc/gitrepository/flux-system/shop/4be1d0c.tar.gz');
      await k.send(P('fluxsrc'), P('fluxkus'), 'HTTP', '200 tar.gz', 'HTTP/1.1 200 OK\nContent-Type: application/x-gzip\n(verified against sha256:e1c0…)');
      k.say(P('fluxkus'), 'build ./apps/prod → dry-run diff: <code>Deployment/orders</code> configured', 3000); await k.wait(700);
    } },
  { who: 'kustomize-controller', cam: 'api', dist: 90, text: 'It applies with server-side apply under field manager <code>kustomize-controller</code>, then the normal Deployment chain creates the second orders Pod.',
    run: async k => {
      await apiCall(k, P('fluxkus'), 'PATCH', '/apis/apps/v1/namespaces/shop/deployments/orders?fieldManager=kustomize-controller', 'PATCH (server-side apply)', 'Content-Type: application/apply-patch+yaml\n\nspec:\n  replicas: 2', { key: '/registry/deployments/shop/orders', reply: '200 OK' });
      k.do(() => spin('replicaset'));
      await apiCall(k, 'kcm', 'POST', '/api/v1/namespaces/shop/pods', 'POST pod', '{"metadata":{"name":"orders-84bd6f5c4-rk2bn"}}');
      await scheduleOne(k, 'orders-…-rk2bn', [['n2', true, 'score 58 (spread: orders already here)'], ['n3', true, 'score 85']], 'n3');
      await apiCall(k, 'sched', 'POST', '/api/v1/namespaces/shop/pods/orders-84bd6f5c4-rk2bn/binding', 'POST binding', '{"target":{"kind":"Node","name":"node-3"}}');
      await podStart(k, 'orders2', 'n3', 3, 'orders-84bd6f5c4-rk2bn', 'orders', '10.244.3.26', { pull: true });
    } },
  { who: 'kustomize-controller', cam: 'n4', dist: 70, text: 'Flux waits for the objects to become healthy (kstatus), then marks the <code>Kustomization</code> Ready with the applied revision. notification-controller can post the result to chat or back to the commit status.',
    run: async k => { await apiCall(k, P('fluxkus'), 'PATCH', '/apis/kustomize.toolkit.fluxcd.io/v1/namespaces/flux-system/kustomizations/shop/status', 'PATCH Kustomization Ready', '{"status":{"conditions":[{"type":"Ready","status":"True","reason":"ReconciliationSucceeded","message":"Applied revision: main@sha1:4be1d0c"}],"lastAppliedRevision":"main@sha1:4be1d0c"}}', { key: '/registry/kustomize.toolkit.fluxcd.io/kustomizations/flux-system/shop' }); k.say(P('fluxkus'), 'Ready · Applied revision <code>main@sha1:4be1d0c</code>', 3200, 'ok'); } },
]},
{ t: 'The Policy Gate', s: 'Admission webhooks: Kyverno mutates, then rejects a :latest image', steps: [
  { who: 'You', cam: 'api', dist: 120, text: 'You try a quick shortcut: <code>kubectl run debug --image=nginx:latest -n shop</code>.',
    run: k => k.send('you', 'api', 'REST', 'POST pods', rest('you', 'POST', '/api/v1/namespaces/shop/pods', '{"kind":"Pod","metadata":{"name":"debug"},"spec":{"containers":[{"name":"debug","image":"nginx:latest"}]}}')) },
  { who: 'kube-apiserver', cam: 'api', text: 'Authentication and RBAC pass. Next comes <b>mutating admission</b>: the apiserver sends an <code>AdmissionReview</code> to every matching mutating webhook. Kyverno adds default labels and returns a JSON patch.',
    run: async k => {
      k.do(() => { flashGate(0); flashGate(1); }); k.say('api', 'authn ✓ · RBAC ✓', 2000, 'ok'); await k.wait(500);
      await k.send('api', P('kyverno'), 'HOOK', 'AdmissionReview (mutate)', 'POST https://kyverno-svc.kyverno.svc:443/mutate?timeout=10s\n\n{"apiVersion":"admission.k8s.io/v1","kind":"AdmissionReview",\n "request":{"uid":"e911…","kind":{"kind":"Pod"},"operation":"CREATE",\n  "userInfo":{"username":"you","groups":["shop-devs"]},\n  "object":{"spec":{"containers":[{"image":"nginx:latest"}]}}}}');
      await k.send(P('kyverno'), 'api', 'HOOK', 'allowed + JSONPatch', '{"response":{"uid":"e911…","allowed":true,"patchType":"JSONPatch",\n "patch":"[{\\"op\\":\\"add\\",\\"path\\":\\"/metadata/labels/team\\",\\"value\\":\\"shop\\"}]"}}');
    } },
  { who: 'Kyverno', cam: P('kyverno'), text: 'After schema validation comes <b>validating admission</b>. Kyverno checks the ClusterPolicy <code>disallow-latest-tag</code>, and the image tag <code>:latest</code> fails it.',
    run: async k => {
      k.do(() => flashGate(2));
      await k.send('api', P('kyverno'), 'HOOK', 'AdmissionReview (validate)', 'POST https://kyverno-svc.kyverno.svc:443/validate/fail?timeout=10s\n\n{"request":{"uid":"e912…","operation":"CREATE","object":{…patched Pod…}}}');
      k.say(P('kyverno'), 'policy <code>disallow-latest-tag</code> · rule <code>validate-image-tag</code> → fail', 3200, 'bad'); await k.wait(700);
      await k.send(P('kyverno'), 'api', 'HOOK', 'allowed: false', '{"response":{"uid":"e912…","allowed":false,\n "status":{"code":400,"message":"validation error: Using a mutable image tag e.g. \'latest\' is not allowed. rule validate-image-tag failed at path /spec/containers/0/image/"}}}');
    } },
  { who: 'kube-apiserver', cam: 'you', dist: 70, text: 'The request is rejected <b>before</b> it reaches etcd. Nothing is stored, no controller or scheduler ever hears about it, and you get the policy message back.',
    run: async k => { k.say('etcd0', 'untouched · nothing persisted', 2600); await k.send('api', 'you', 'REST', '400 denied by webhook', 'HTTP/2 400 Bad Request\n\nError from server: admission webhook "validate.kyverno.svc-fail" denied the request:\n\npolicy Pod/shop/debug for resource violation:\n\ndisallow-latest-tag:\n  validate-image-tag: Using a mutable image tag e.g. \'latest\' is not allowed.'); } },
]},
{ t: 'Roots of Storage', s: 'StatefulSet → PVC → CSI provision → attach → mount → Pod', steps: [
  { who: 'You', cam: 'api', dist: 120, text: 'You apply a <code>StatefulSet</code> for PostgreSQL with a <code>volumeClaimTemplate</code> asking for 20Gi of <code>pd-ssd</code>.',

// ---------- quest runner ----------
let run = null, nextRes = null, afterQuest = null, auto = true;
const flowEl = $('#flow'), whoEl = $('#who'), txtEl = $('#txt'), stepEl = $('#stepn'), nextBtn = $('#bNext');
let typer = 0;
function dialogue(who, html) {
  whoEl.textContent = who; clearInterval(typer);
  if (REDUCED) { txtEl.innerHTML = html; return; }
  // typewriter over visible text while keeping inline tags intact
  const parts = html.split(/(<[^>]+>)/); let i = 0, ci = 0, out = '';
  txtEl.innerHTML = '';
  typer = setInterval(() => {
    for (let n = 0; n < 3 && i < parts.length; n++) {
      const p = parts[i];
      if (p.startsWith('<')) { out += p; i++; continue; }
      out += p[ci++] || ''; if (ci >= p.length) { i++; ci = 0; }
    }
    txtEl.innerHTML = out; if (i >= parts.length) clearInterval(typer);
  }, 16);
}
function stopQuest() {
  if (run) run.dead = true; run = null; afterQuest = null; spot = null; flowEl.innerHTML = '';
  const nr = nextRes; nextRes = null; nr && nr();
  waiters.forEach(w => w.res()); waiters = [];
  clearPackets();
  nextBtn.disabled = true;
}
function renderFlow(q, who) {
  if (q.tour) { flowEl.innerHTML = ''; return; }
  const cast = [...new Set(q.steps.map(s => s.who))];
  const upto = who ? q.steps.findIndex(s => s.who === who) + 1 : q.steps.length;
  const seen = new Set(q.steps.slice(0, upto).map(s => s.who));
  flowEl.innerHTML = cast.map(w => `<span class="${w === who ? 'now' : seen.has(w) ? 'done' : ''}">${esc(w)}</span>`).join('<i>→</i>');
}
async function startQuest(qi) {
  stopQuest(); clearLog();
  const r = run = { dead: false }, q = QUESTS[qi], k = mkKit(r);
  document.querySelectorAll('.q').forEach((b, i) => b.classList.toggle('on', i === qi));
  closeDrawers(); $('#insp').hidden = true;
  resetWorld(); controls.autoRotate = false;
  for (let i = 0; i < q.steps.length; i++) {
    if (r.dead) return;
    const s = q.steps[i];
    stepEl.textContent = `${q.t} · ${i + 1}/${q.steps.length}`;
    dialogue(s.who, s.text);
    spot = new Set(s.cam && s.cam !== 'home' ? [s.cam] : []);
    renderFlow(q, s.who);
    if (s.cam === 'home') flyHome(); else if (s.cam && !follow) flyTo(s.cam, s.dist);
    nextBtn.disabled = true;
    await wait(500); if (r.dead) return;
    try { await s.run(k); } catch (e) { console.error(e); }
    if (r.dead) return;
    if (i < q.steps.length - 1) {
      nextBtn.disabled = false;
      await new Promise(res => { nextRes = res; if (auto) wait(Math.max(1800, s.text.replace(/<[^>]+>/g, '').length * 26)).then(res); });
      nextRes = null;
    }
  }
  if (r.dead) return;
  spot = null; renderFlow(q, null);
  stepEl.textContent = `${q.t} · complete`;
  if (qi + 1 < QUESTS.length) { nextBtn.disabled = false; afterQuest = () => startQuest(qi + 1); dialogue('Skyrealm', `Quest complete. Press Continue for <b>${QUESTS[qi + 1].t}</b>, pick another quest, or keep exploring.`); }
}

const RUSH = [

  { n: 'log-agent-h8s', cpu: 200, mem: 256, tol: ['gpu', 'pool'] },
