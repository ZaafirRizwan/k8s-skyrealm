const RUSH_NODES = () => ({
  n1: { cpu: 2000, used: 800, mem: 4096, mused: 1024, labels: { zone: 'a' }, taint: null },
  n2: { cpu: 2000, used: 600, mem: 4096, mused: 1536, labels: { zone: 'b' }, taint: null },
  n3: { cpu: 2000, used: 300, mem: 8192, mused: 1024, labels: { gpu: 'true' }, taint: 'gpu' },
  n4: { cpu: 1500, used: 900, mem: 4096, mused: 2048, labels: { pool: 'platform' }, taint: 'pool' },
});
const TAINT_TXT = { gpu: 'gpu=true:NoSchedule', pool: 'pool=platform:NoSchedule' };
function whyNot(p, k, N) {
  const n = N[k], name = NODE[k].name;
  if (n.taint && !(p.tol || []).includes(n.taint)) return `${name} has taint <code>${TAINT_TXT[n.taint]}</code> and this Pod doesn't tolerate it.`;
  for (const [a, b] of Object.entries(p.sel || {})) if (n.labels[a] !== b) return `nodeSelector <code>${a}=${b}</code> doesn't match ${name}.`;
  if (p.cpu > n.cpu - n.used) return `${name} has only ${n.cpu - n.used}m CPU free; the Pod requests ${p.cpu}m.`;
  if (p.mem > n.mem - n.mused) return `${name} has only ${n.mem - n.mused}Mi memory free; the Pod requests ${p.mem}Mi.`;
  return null;
}
async function runRush(run) {
  G.cur = 'sched'; visit('sched'); player.visible = false; flyHome();
  const N = RUSH_NODES();
  $('#mlist').innerHTML = `<h4>How the scheduler decides</h4><ul><li><b>Filter</b>: the Pod's CPU and memory requests must fit, it must tolerate the node's taints, and its nodeSelector must match the node's labels.</li><li><b>Score</b>: among nodes that pass, prefer the one with the most room left (LeastAllocated).</li><li>If <b>no</b> node passes, the Pod stays <b>Pending</b> until something frees up.</li></ul>`;
  $('#mrank').innerHTML = '<b>Scheduler Rush</b> · place each Pod, or leave it Pending';
  $('#quests').hidden = false;
  for (const [n, p] of RUSH.entries()) {
    if (run.dead) return;
    const valid = ['n1', 'n2', 'n3', 'n4'].filter(k => !whyNot(p, k, N));
    const best = valid.slice().sort((a, b) => (N[b].cpu - N[b].used) - (N[a].cpu - N[a].used))[0];
    const KEYS = ['n1', 'n2', 'n3', 'n4'];
    const result = await new Promise(res => {
      feedback('');
      const opts = KEYS.map(k => { const x = N[k]; return { label: NODE[k].name, hint: `CPU ${x.cpu - x.used}m free · mem ${x.mem - x.mused}Mi · ${x.taint ? 'taint ' + TAINT_TXT[x.taint] : 'no taints'} · ${Object.entries(x.labels).map(e => e.join('=')).join(' ')}` }; });
      opts.push({ label: 'Leave Pending', kbd: '0', hint: 'no node passes the filter' });
      gbar(`Pod ${n + 1} of ${RUSH.length}`, `<div class="req"><div><span>Pod</span><b>${esc(p.n)}</b></div><div><span>Requests</span><b>${p.cpu}m CPU · ${p.mem}Mi memory</b></div><div><span>nodeSelector</span><b>${p.sel ? Object.entries(p.sel).map(e => e.join('=')).join(', ') : 'none'}</b></div><div><span>Tolerates</span><b>${p.tol ? p.tol.map(t => TAINT_TXT[t]).join(', ') : 'nothing'}</b></div></div>`,
        opts, (j, btn) => {
          if (run.dead) return res('dead');
          const pick = j === 4 ? 'pending' : KEYS[j];
          const miss = why => { btn.disabled = true; btn.classList.add('wrong'); G.hearts--; G.combo = 0; G.mistakes.push({ q: p.n, why }); feedback('✗ ' + why, 'bad'); flashScreen(); hud(); if (G.hearts <= 0) { gLocked = true; res('lost'); } };
          if (pick === 'pending') {
            if (valid.length) return miss(`It fits on ${valid.map(k => NODE[k].name).join(', ')}, so it shouldn't stay Pending.`);
            gLocked = true; btn.classList.add('right'); G.combo++; G.score += 120; hud();
            feedback('✓ Correct: no node passes the filter, so the Pod stays Pending until capacity frees up or the cluster autoscaler adds a node.', 'ok');
            return res('ok');
          }
          const why = whyNot(p, pick, N); if (why) return miss(why);
          gLocked = true; btn.classList.add('right'); G.combo++;
          const bonus = pick === best; G.score += 100 + (bonus ? 50 : 0); hud();
          N[pick].used += p.cpu; N[pick].mused += p.mem;
          feedback(bonus ? `✓ Bound to ${NODE[pick].name}: it fits and leaves the most room (the default scheduler's choice).` : `✓ It fits on ${NODE[pick].name}. The default scheduler would have preferred ${NODE[best].name} (most room left).`, 'ok');
          aimScope(pick);
          launch({ from: 'sched', legs: [{ to: 'api', proto: 'REST', label: 'POST binding → ' + NODE[pick].name, payload: `{"kind":"Binding","metadata":{"name":"${p.n}"},"target":{"kind":"Node","name":"${NODE[pick].name}"}}` }, { to: pick + '.kubelet', proto: 'WATCH', label: 'Pod bound to ' + NODE[pick].name, payload: `ADDED Pod ${p.n} (spec.nodeName=${NODE[pick].name})` }] })
            .then(() => { const used = new Set(Object.values(pods).filter(x => x.node === pick).map(x => x.slot)); const slot = [0, 1, 2, 3, 4, 5].find(s => !used.has(s)); if (slot !== undefined && G.run === run) spawnPod('rush' + n, pick, slot, p.n, p.n.startsWith('web') ? 'web' : p.n.startsWith('orders') ? 'orders' : 'checkout', '10.244.' + pick[1] + '.' + (60 + n)); });
          res('ok');
        });
    });

{ t: 'The Traveler\'s Request', kind: 'run', tag: 'Runner', d: 'Carry a browser request through the load balancer, iptables, ingress and the overlay network, then bring the answer home.', start: 'you',

  steps: [
    { c: 'say', who: 'Your mission', text: 'You are <code>GET https://shop.realm.io/</code>, sent by a shopper\'s browser. Reach a healthy web Pod and bring the page back. Watch out: one web Pod is failing its readiness probe.' },

    { c: 'choose', carry: ['HTTP', '→ 10.244.1.5:443'], prompt: 'Who owns 10.244.1.5?', opts: [

    { c: 'ride', to: 'pod:dns', proto: 'DNS', label: 'A? orders' },

    { c: 'ride', to: 'n2.vtep', proto: 'DNS', label: 'A 10.96.88.4' },
    { c: 'ride', to: 'n1.vtep', proto: 'VXLAN', label: 'VXLAN → node-1' },
    { c: 'ride', to: 'n1.proxy', proto: 'DNS', label: 'un-DNAT reply' },
    { c: 'ride', to: 'pod:web1', proto: 'DNS', label: 'orders = 10.96.88.4' },

    { c: 'ride', to: 'n1.vtep', proto: 'HTTP', label: '→ 10.244.2.21:8080' },
    { c: 'ride', to: 'n2.vtep', proto: 'VXLAN', label: 'VXLAN → node-2' },
    { c: 'ride', to: 'pod:orders', proto: 'HTTP', label: 'GET /orders' },

{ t: 'GitOps Courier', kind: 'run', tag: 'Runner', d: 'Carry a commit from git push through Argo CD until the cluster matches Git.', start: 'you',

  steps: [

      ['git', true, 'It fetches the new objects from the repository.'],

// ---------- UI glue ----------
function renderMissions() {
  const ts = totalStars();
  $('#mrank').innerHTML = `Rank: <b>${rankOf(ts)}</b> · ${ts}/${LEVELS.length * 3} ★ · Codex ${save.codex.length}/${CODEX.length}`;
  $('#mlist').innerHTML = LEVELS.map((L, i) => `<button class="q${G.level === i && G.active ? ' on' : ''}" data-l="${i}"><i>${i + 1}</i><b>${esc(L.t)} <em class="tag">${L.tag}</em></b><span>${L.d}<br><span class="st">${'★'.repeat(save.stars[i] || 0)}${'☆'.repeat(3 - (save.stars[i] || 0))}</span></span></button>`).join('')
    + '<div class="btnrow"><button class="btn" id="bCodex">Open Codex</button></div>';
  $('#mlist').querySelectorAll('[data-l]').forEach(b => b.onclick = () => runLevel(+b.dataset.l));
  $('#bCodex').onclick = showCodex;
}
function playLobby() {
  if (G.run) G.run.dead = true; G.run = null; cleanupRide();
  G.level = -1; G.kind = null; G.carry = null; player.visible = false; spot = null;
  $('#hud').hidden = true; renderMissions(); resetWorld(); flyHome();
  const next = LEVELS.findIndex((_, i) => !save.stars[i]);
  const start = next < 0 ? 0 : next;
  feedback('');
  gbar('Packet Runner', 'You become the data. Ride the streams between components and choose the right path at every stop. Wrong turns cost a heart and teach you why. Pick a mission on the left, or start here:',
    [{ label: `Play: ${LEVELS[start].t}`, kbd: '↵' }], () => runLevel(start));
}
function setMode(play) {
  G.active = play;
  $('#mExplore').classList.toggle('on', !play); $('#mPlay').classList.toggle('on', play);
  $('#qhead').textContent = play ? 'Missions' : 'Quests';
  $('#qlist').hidden = play; $('#legendBox').hidden = play; $('#mwrap').hidden = !play;
  $('#dlg').hidden = play; $('#gbar').hidden = !play; $('#insp').hidden = true;
  if (play) { stopQuest(); playLobby(); }
  else { if (G.run) G.run.dead = true; G.run = null; cleanupRide(); player.visible = false; $('#hud').hidden = true; spot = null; hideModal(); controls.enabled = true; resetWorld(); flyHome(); }
}
$('#mExplore').onclick = () => setMode(false);
$('#mPlay').onclick = () => setMode(true);
$('#steer').querySelectorAll('button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); RS.lane = Math.max(-1, Math.min(1, RS.lane + +b.dataset.d)); }));
$('#bBoost').addEventListener('pointerdown', () => RS.boost = true);
addEventListener('pointerup', () => { if (RS.ride) RS.boost = false; });
addEventListener('keydown', e => {
  if (!G.active || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  let used = true;
  if (!$('#modal').hidden) { if (k === 'Escape') hideModal(); else used = false; }
  else if (RS.ride) {
    if (k === 'a' || k === 'ArrowLeft') RS.lane = Math.max(-1, RS.lane - 1);
    else if (k === 'd' || k === 'ArrowRight') RS.lane = Math.min(1, RS.lane + 1);
    else if (k === 'w' || k === 'ArrowUp' || k === 'Shift') RS.boost = true;
    else used = false;
  }
  else if (G.kind === 'gate' && (k === 'a' || k === 'ArrowLeft')) pickOpt(0);
  else if (G.kind === 'gate' && (k === 'd' || k === 'ArrowRight')) pickOpt(1);
  else if (/^[0-9]$/.test(k)) pickOpt(k === '0' ? gOpts.length - 1 : +k - 1);
  else if ((k === 'Enter' || k === ' ') && gOpts.length === 1) pickOpt(0);
  else if (k === 'Escape') playLobby();
  else if (k === ' ' || k === 'ArrowRight' || k === 'ArrowLeft' || k === 'Enter') { /* swallow explore-mode shortcuts */ }
  else used = false;
  if (used) { e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
addEventListener('keyup', e => { if (['w', 'W', 'ArrowUp', 'Shift'].includes(e.key)) RS.boost = false; });
// self-check: every runner choice has exactly one right answer and points at real components
LEVELS.forEach(L => (L.steps || []).forEach(s => { if (s.opts) console.assert(s.opts.filter(o => o[1]).length === 1 && (s.c !== 'choose' || s.opts.every(o => C[o[0]])), `level ${L.t}: ${s.prompt}`); }));

</script>
